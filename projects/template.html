<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title id="page-title">Project Details</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Six+Caps&family=Karma:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
</head>

<body>
    <header class="site-header">
        <nav class="nav-left">
            <a href="../index.html" class="active">home</a>
            <a href="../projects.html">projects</a>
            <a href="../blog.html">blog</a>
        </nav>

        <div class="site-logo-icon">
            <a href="../index.html">
                <img src="../images/logo-icon.webp" alt="Logo" class="nav-icon-img">
            </a>
        </div>

        <div class="nav-right">
            <a href="../contact.html" class="pill-btn">lets connect</a>
        </div>
    </header>

    <div id="proj-cover" class="project-cover-banner"></div>

    <main class="project-detail-main">
        <h1 id="proj-title" class="project-detail-heading"></h1>
        <p id="proj-subtitle" class="project-detail-sub"></p>
        <div id="proj-tags" class="project-detail-tags"></div>
    </main>

    <div class="project-detail-description" id="proj-desc"></div>


    <script>
        async function loadSingleProject() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            const res = await fetch('../data/projects.yml');
            const text = await res.text();
            const projects = jsyaml.load(text) || [];

            const project = projects.find(p => p.slug === slug);

            if (!project) {
                document.body.innerHTML = '<h2 style="text-align:center; margin-top:20vh; color:#fff;">Project not found.</h2>';
                return;
            }

            document.getElementById('page-title').textContent = project.title;
            document.getElementById('proj-title').textContent = project.title;
            document.getElementById('proj-subtitle').textContent = project.subtitle;

            if (project.cover_image) {
                const coverUrl = `../${project.cover_image}`;
                const img = new Image();

                img.onload = () => {
                    document.getElementById('proj-cover').style.backgroundImage = `url("${coverUrl}")`;
                };

                img.onerror = () => {
                    console.error('Could not load cover:', coverUrl);
                };

                img.src = coverUrl;
            }

            document.getElementById('proj-tags').innerHTML = project.tags
                .map(t => `<span class="project-tag-pill">${t}</span>`).join('');

            const descContainer = document.getElementById('proj-desc');
            const parsedHTML = project.description
                .split('\n\n')
                .map(block => {
                    block = block.trim();
                    if (!block) return '';
                    if (block.endsWith('.png') || block.endsWith('.jpg') || block.endsWith('.jpeg') || block.endsWith('.webp')) {
                        const cleanPath = block.replace(/^(\.\/|\/)/, '');
                        return `<div class="project-inline-img-wrap"><img src="../${cleanPath}" alt="Project Detail Image"></div>`;
                    }

                    return `<p>${block}</p>`;
                })
                .join('');

            descContainer.innerHTML = parsedHTML;
        }

        document.addEventListener('DOMContentLoaded', loadSingleProject);
    </script>

    <div class="scroll-marquee">
        <div class="scroll-marquee-track">
            <span>☆ connect with brent feir ☆ collaborate with brent feir ☆ create with brent feir ☆</span>
            <span>☆ connect with brent feir ☆ collaborate with brent feir ☆ create with brent feir ☆</span>
        </div>
    </div>
    
    <footer class="site-footer">
        <p>&copy; 2026 Brent Feir</p>
        <div class="social-links">
            <button class="copy-email-btn" id="copyEmailBtn" data-email="feirbrent@gmail.com">email</button>
            <a href="https://www.linkedin.com/in/brent-feir/" target="_blank">linkedin</a>
            <a href="https://www.instagram.com/creativelyby.brent/" target="_blank">instagram</a>
        </div>
    </footer>

    <script>
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.copy-email-btn');
            if (!btn) return;

            navigator.clipboard.writeText(btn.dataset.email)
                .then(() => {
                    const orig = btn.textContent;
                    btn.textContent = 'copied!';
                    setTimeout(() => btn.textContent = orig, 2000);
                })
                .catch(() => {
                    alert('Could not copy email address.');
                });
        });

        document.addEventListener('click', function (e) {
            const link = e.target.closest('nav a');
            if (link) {
                sessionStorage.setItem('internalNav', 'true');
            }
        });
    </script>

</body>

</html>
