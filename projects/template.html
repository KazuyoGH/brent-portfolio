<!-- projects/template.html-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title id="page-title">Project Details</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>

<body>
    <!-- Navbar placeholder matching your design -->
    <header class="site-header">
        <nav class="nav-left">
            <a href="../index.html" class="active">home</a>
            <a href="../projects.html">projects</a>
            <a href="../blog.html">blog</a>
        </nav>

        <div class="site-logo-icon">
            <a href="index.html">
                <img src="../images/logo-icon.png" alt="Logo" class="nav-icon-img">
            </a>
        </div>

        <div class="nav-right">
            <a href="contact.html" class="pill-btn">lets connect</a>
        </div>
    </header>

    <main class="project-detail-main">
        <h1 id="proj-title" class="project-detail-heading"></h1>
        <p id="proj-subtitle" class="project-detail-sub"></p>

        <div id="proj-tags" class="project-detail-tags"></div>

        <div class="project-detail-description" id="proj-desc"></div>

        <div class="project-detail-hero-img-wrap">
            <img id="proj-hero-img" src="" alt="Project Image">
        </div>
    </main>

    <script>
        async function loadSingleProject() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            const res = await fetch('../data/projects.yml');
            const text = await res.text();
            const projects = jsyaml.load(text) || [];

            const project = projects.find(p => p.slug === slug);

            if (!project) {
                document.body.innerHTML = '<h2 style="text-align:center; margin-top:20vh; color:#fff;">Project not found.</h2>';
                return;
            }

            document.getElementById('page-title').textContent = project.title;
            document.getElementById('proj-title').textContent = project.title;
            document.getElementById('proj-subtitle').textContent = project.subtitle;
            document.getElementById('proj-hero-img').src = `../${project.hero_image}`;

            document.getElementById('proj-tags').innerHTML = project.tags
                .map(t => `<span class="project-tag-pill">${t}</span>`).join('');

            // Format multi-paragraph description text cleanly
            const descContainer = document.getElementById('proj-desc');
            descContainer.innerHTML = project.description
                .split('\n\n')
                .map(paragraph => `<p>${paragraph.trim()}</p>`)
                .join('');
        }

        document.addEventListener('DOMContentLoaded', loadSingleProject);
    </script>

    <footer class="site-footer">
        <p>&copy; 2026 Brent Feir</p>
        <div class="social-links">
            <button class="copy-email-btn" id="copyEmailBtn" data-email="feirbrent@gmail.com">email</button>
            <a href="https://www.linkedin.com/in/brent-feir/" target="_blank">linkedin</a>
            <a href="https://www.instagram.com/creativelyby.brent/" target="_blank">instagram</a>
        </div>
    </footer>
</body>

</html>
