    <script>
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.copy-email-btn');
            if (!btn) return;

            navigator.clipboard.writeText(btn.dataset.email)
                .then(() => {
                    const orig = btn.textContent;
                    btn.textContent = 'copied!';
                    setTimeout(() => btn.textContent = orig, 2000);
                })
                .catch(() => {
                    alert('Could not copy email address.');
                });
        });

        document.addEventListener('click', function (e) {
            const link = e.target.closest('nav a');
            if (link) {
                sessionStorage.setItem('internalNav', 'true');
            }
        });
    </script>
    <script>
        (function () {
            const track = document.getElementById('track');
            if (!track || !track.children) return;

            const originalSpan = track.children[0];

            // Need to wait briefly for the font to render so offsetWidth is accurate
            requestAnimationFrame(function init() {
                const singleW = originalSpan.offsetWidth;
                if (singleW === 0) { setTimeout(() => requestAnimationFrame(init), 50); return; }

                const viewportW = window.innerWidth;
                const copiesNeeded = Math.ceil(viewportW / singleW) + 3;

                while (track.children.length < copiesNeeded) {
                    track.appendChild(originalSpan.cloneNode(true));
                }

                const actualSegWidth = track.scrollWidth / track.children.length;

                let pos = 0;
                const speed = 1.5;

                function loop() {
                    pos -= speed;
                    if (Math.abs(pos) >= actualSegWidth) pos = 0;
                    track.style.transform = `translateX(${pos}px)`;
                    requestAnimationFrame(loop);
                }
                loop();
            });
        })();
    </script>
    <script src="js/projects.js"></script>
