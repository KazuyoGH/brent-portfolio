  title: "My Academic Awards for '25-'26"
  date: "September 1, 2026"
  thumbnail: "images/blog/image1.webp"
  excerpt: "A reflection on all of the academic awards I've gotten"
  content: |
    "Maybe you shouldn't aim for awards."

    I used to have this mindset back in high school. My parents never pressured me to excel in my academics, neither did any of my friends and classmates.

    But I pressured myself anyway. ❤️‍🩹

    I realized that pressuring myself could become unhealthy, but in more ways than one, it allowed me to push through my boundaries, challenge myself, and find success in places where people might not look for.

    🏅 I've recently claimed my last academic year's awards, for my academic excellence and student council service.

    This made me realize that all of the medals I've gained over my academic life don't carry over when I'm applying and working in the workforce, but working to gain these medals better shape the character you build and it becomes a visible milestone in my learning and academic journey.

    🗒️ If I had to tell my younger self a piece of advice, it would to always keep reaching for more, continuing to learn, and stepping outside your boundaries..

    Even if you aren't confident.
